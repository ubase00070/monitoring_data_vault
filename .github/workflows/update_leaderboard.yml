name: Update Leaderboard
on:
  issues:
    types: [opened]

jobs:
  update-json:
    # 이슈 제목에 RANK_UPDATE가 포함된 경우에만 실행
    if: contains(github.event.issue.title, 'RANK_UPDATE')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Issue and Update JSON
        shell: python
        run: |
          import json
          import os
          import re

          # 이슈 본문 가져오기
          issue_body = os.getenv('ISSUE_BODY')
          # 정규표현식으로 DATA[...] 내부 값 추출
          match = re.search(r"DATA\[(.*?)\]", issue_body)
          if not match:
              print("데이터 형식이 올바르지 않습니다.")
              exit(1)
          
          # 관제사명|점수|시간 분리
          new_entry = match.group(1).split('|')
          name, score, play_time = new_entry[0], int(new_entry[1]), new_entry[2]
          
          # JSON 로드
          with open('leaderboard.json', 'r', encoding='utf-8') as f:
              db = json.load(f)

          # 새로운 점수 추가
          db['scores'].append({
              "name": name,
              "score": score,
              "time": play_time,
              "date": os.getenv('DATE')[:10] # YYYY-MM-DD
          })

          # 점수 기준 내림차순 정렬 후 상위 10명만 남김
          db['scores'] = sorted(db['scores'], key=lambda x: x['score'], reverse=True)[:10]

          # JSON 저장
          with open('leaderboard.json', 'w', encoding='utf-8') as f:
              json.dump(db, f, indent=2, ensure_ascii=False)

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json
          git commit -m "🏆 리더보드 업데이트: ${{ github.event.issue.user.login }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close Issue
        run: gh issue close ${{ github.event.issue.number }} --comment "기록이 리더보드에 반영되었습니다!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
    env:
      ISSUE_BODY: ${{ github.event.issue.body }}
      DATE: ${{ github.event.issue.created_at }}
